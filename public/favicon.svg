<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!--
    Honest Eval. Three stacked, slightly offset rounded bars, heaviest at the
    bottom: a cairn (the repo's codename) and observations stacking into a record.
    The accent tick rising off the top bar is the ratification, which is the app's
    whole claim.

    Flat fills and one stroked path. No gradients, no filters, no masks: the mark
    this replaced was a purple gradient behind sixteen blur filters, which matched
    nothing in the app and turned to mud at 16px. The colours are the designation
    ramp's steps 1, 2 and 3 plus the accent, hard coded here because an SVG in
    public/ is rasterized by scripts/gen-icons.ts outside any stylesheet.

    Kept in sync BY HAND with src/components/Mark.tsx, which draws the same
    geometry from the tokens. Change one, change the other, or the installed icon
    and the header will quietly disagree.

    (No double hyphens anywhere in this comment: XML forbids them, and sharp fails
    the whole icon build with a "corrupt header" parse error if one appears.)
  -->
  <rect x="5" y="33" width="36" height="9" rx="4.5" fill="#104281"/>
  <rect x="8" y="21" width="28" height="9" rx="4.5" fill="#256abf"/>
  <rect x="11" y="9" width="14" height="9" rx="4.5" fill="#5598e7"/>
  <path d="M 29 14 L 33 18 L 42 6" fill="none" stroke="#2563eb" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
